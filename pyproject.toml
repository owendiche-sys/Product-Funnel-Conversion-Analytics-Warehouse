[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-funnel-conversion-analytics-warehouse"
version = "0.2.0"
description = "End-to-end product funnel analytics warehouse with data quality checks, feature engineering, and conversion propensity modeling."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "streamlit>=1.30,<2.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
